name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Intervals Companion Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        env:
          VITE_CAPACITOR_BUILD: 'true'
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          npx cap add android
          npx cap sync android

      - name: Configure Android OAuth Deep-Link, Orientation & App Icons
        run: |
          # 1. Write MainActivity.java with intervalscompanion://oauth/callback handler and phone portrait lock
          cat << 'EOF' > android/app/src/main/java/icu/intervals/companion/MainActivity.java
          package icu.intervals.companion;

          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyDeviceOrientationPolicy();
                  handleOAuthIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleOAuthIntent(intent);
              }

              private void applyDeviceOrientationPolicy() {
                  Configuration config = getResources().getConfiguration();
                  if (config.smallestScreenWidthDp < 600) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_FULL_USER);
                  }
              }

              private void handleOAuthIntent(Intent intent) {
                  if (intent == null) return;
                  Uri data = intent.getData();
                  if (data != null && "intervalscompanion".equals(data.getScheme())) {
                      String code = data.getQueryParameter("code");
                      if (code != null && !code.isEmpty() && getBridge() != null && getBridge().getWebView() != null) {
                          final String targetUrl = getBridge().getServerUrl() + "/?code=" + Uri.encode(code);
                          getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl(targetUrl));
                      }
                  }
              }
          }
          EOF

          # 2. Register intervalscompanion://oauth/callback intent-filter in AndroidManifest.xml
          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          deep_link_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="intervalscompanion" android:host="oauth" android:pathPrefix="/callback" />
                      </intent-filter>
                  </activity>"""

          if 'android:scheme="intervalscompanion"' not in content:
              content = content.replace("</activity>", deep_link_filter, 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          # 3. Copy official Intervals Companion icon into mipmap folders
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png" || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Assemble Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Intervals Companion APK Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: Intervals-Companion-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
