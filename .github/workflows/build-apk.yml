name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Intervals Companion Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        env:
          VITE_CAPACITOR_BUILD: 'true'
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${APP_VER}" >> "$GITHUB_ENV"
          VITE_APP_VERSION="${APP_VER}" npm install --legacy-peer-deps
          VITE_APP_VERSION="${APP_VER}" npm run build

      - name: Initialize Capacitor Android project
        run: |
          npm install --legacy-peer-deps @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/browser@^6.0.0 @capacitor/local-notifications@^6.0.0
          npx cap add android
          npx cap sync android

      - name: Configure Android OAuth Deep-Link, Notifications, Orientation & App Icons
        run: |
          mkdir -p android/app/src/main/java/icu/intervals/companion

          # 1. Write MainActivity.java with intervalscompanion://oauth/callback handler, in-app back gesture, NotificationChannel, and phone portrait lock
          cat << 'EOF' > android/app/src/main/java/icu/intervals/companion/MainActivity.java
          package icu.intervals.companion;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyDeviceOrientationPolicy();
                  ensureNotificationChannelAndPermission();
                  registerInAppBackGesture();
                  handleOAuthIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleOAuthIntent(intent);
              }

              private void applyDeviceOrientationPolicy() {
                  Configuration config = getResources().getConfiguration();
                  if (config.smallestScreenWidthDp < 600) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_FULL_USER);
                  }
              }

              private void ensureNotificationChannelAndPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          NotificationChannel channel = new NotificationChannel(
                              "morning-workout-digest",
                              "Morning Workout Digest",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.setDescription("Daily morning summary of your planned Intervals.icu workouts");
                          channel.enableVibration(true);
                          nm.createNotificationChannel(channel);
                      }
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              1001
                          );
                      }
                  }
              }

              private void registerInAppBackGesture() {
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              getBridge().getWebView().evaluateJavascript(
                                  "(function() { return typeof window.__handleAndroidBackGesture === 'function' ? Boolean(window.__handleAndroidBackGesture()) : false; })()",
                                  value -> {
                                      if (!"true".equals(value)) {
                                          moveTaskToBack(true);
                                      }
                                  }
                              );
                          } else {
                              moveTaskToBack(true);
                          }
                      }
                  });
              }

              private void handleOAuthIntent(Intent intent) {
                  if (intent == null) return;
                  Uri data = intent.getData();
                  if (data != null && "intervalscompanion".equals(data.getScheme())) {
                      String code = data.getQueryParameter("code");
                      String state = data.getQueryParameter("state");
                      if (code != null && !code.isEmpty() && getBridge() != null && getBridge().getWebView() != null) {
                          String localUrl = getBridge().getLocalUrl();
                          if (localUrl == null || localUrl.isEmpty() || localUrl.contains("null")) {
                              localUrl = "https://localhost";
                          }
                          if (localUrl.endsWith("/")) {
                              localUrl = localUrl.substring(0, localUrl.length() - 1);
                          }
                          String stateParam = (state != null && !state.isEmpty()) ? "&state=" + Uri.encode(state) : "";
                          final String targetUrl = localUrl + "/?code=" + Uri.encode(code) + stateParam;
                          getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl(targetUrl));
                      }
                  }
              }
          }
          EOF

          # 2. Register intervalscompanion://oauth/callback intent-filter and POST_NOTIFICATIONS permission in AndroidManifest.xml
          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          deep_link_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.action.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="intervalscompanion" android:host="oauth" android:pathPrefix="/callback" />
                      </intent-filter>
                  </activity>"""

          if 'android:scheme="intervalscompanion"' not in content:
              content = content.replace("</activity>", deep_link_filter, 1)

          notif_permissions = """    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("<application", notif_permissions + "\n    <application", 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          # 3. Copy minimalistic Intervals Companion adaptive icon layers into density-specific mipmap folders
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-${density}"
            if [ -d "$dir" ]; then
              cp public/ic_launcher.png "$dir/ic_launcher.png"
              cp public/ic_launcher.png "$dir/ic_launcher_round.png"
              cp public/ic_launcher_foreground.png "$dir/ic_launcher_foreground.png"
              cp public/ic_launcher_background.png "$dir/ic_launcher_background.png"
              cp public/ic_launcher_monochrome.png "$dir/ic_launcher_monochrome.png"
            fi
          done

          # 4. Configure adaptive + monochrome icon XML descriptors in mipmap-anydpi-v26 (no leading whitespace before <?xml)
          python3 - << 'PYEOF'
          import os
          os.makedirs("android/app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@mipmap/ic_launcher_background" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '    <monochrome android:drawable="@mipmap/ic_launcher_monochrome" />\n'
              '</adaptive-icon>\n'
          )
          for fname in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"android/app/src/main/res/mipmap-anydpi-v26/{fname}", "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)
          PYEOF

      - name: Configure Release Signing Keystore & Version in build.gradle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p release-out
          EFF_STORE_PASS="${KEYSTORE_PASS:-IntervalsCompanion2026!}"
          EFF_KEY_ALIAS="${KEY_ALIAS_NAME:-upload}"
          EFF_KEY_PASS="${KEY_PASS:-$EFF_STORE_PASS}"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 from GitHub Repository Secrets..."
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > android/app/upload-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set yet — generating new Upload Keystore with keytool..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$EFF_KEY_ALIAS" \
              -storepass "$EFF_STORE_PASS" \
              -keypass "$EFF_KEY_PASS" \
              -dname "CN=Intervals Companion, OU=Mobile, O=IntervalsCompanion, L=Berlin, ST=Berlin, C=DE"

            base64 -w 0 android/app/upload-keystore.jks > release-out/ANDROID_KEYSTORE_BASE64.txt
            cat << 'TXT' > release-out/HOW_TO_SAVE_KEYSTORE_IN_GITHUB_SECRETS.txt
          ===========================================================================
          HOW TO LOCK IN YOUR UPLOAD KEYSTORE FOR FUTURE UPDATES & GOOGLE PLAY
          ===========================================================================
          To ensure every future APK update installs seamlessly over your existing app
          (without uninstalling) and matches your Google Play Upload Key:

          1. Open your GitHub repository -> Settings -> Secrets and variables -> Actions
          2. Click "New repository secret":
             - Name: ANDROID_KEYSTORE_BASE64
             - Secret: Paste the entire single-line string from ANDROID_KEYSTORE_BASE64.txt
          3. Also ensure ANDROID_KEYSTORE_PASSWORD is saved in Repository Secrets
             (if you did not set one yet, the generated keystore used: IntervalsCompanion2026!)
          ===========================================================================
          TXT
          fi

          # Patch android/app/build.gradle with versionCode, versionName, and release signingConfigs
          python3 - << 'PYEOF'
          import os, re

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              content = f.read()

          app_ver = os.environ.get("APP_VERSION", "1.3.0")
          run_num = int(os.environ.get("RUN_NUMBER", "1"))
          ver_code = 100 + run_num

          content = re.sub(r'versionCode\s+\d+', f'versionCode {ver_code}', content, count=1)
          content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{app_ver}"', content, count=1)

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('EFF_STORE_PASS') ?: 'IntervalsCompanion2026!'
                      keyAlias System.getenv('EFF_KEY_ALIAS') ?: 'upload'
                      keyPassword System.getenv('EFF_KEY_PASS') ?: 'IntervalsCompanion2026!'
                  }
              }
          """

          if "signingConfigs" not in content:
              content = content.replace("buildTypes {", signing_block + "\n    buildTypes {", 1)
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content,
                  count=1
              )

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Assemble Signed Release APK & Google Play AAB Bundle
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export EFF_STORE_PASS="${KEYSTORE_PASS:-IntervalsCompanion2026!}"
          export EFF_KEY_ALIAS="${KEY_ALIAS_NAME:-upload}"
          export EFF_KEY_PASS="${KEY_PASS:-$EFF_STORE_PASS}"

          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

          cp app/build/outputs/apk/release/app-release.apk "../release-out/Intervals-Companion-v${APP_VERSION}-b${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../release-out/Intervals-Companion-v${APP_VERSION}-b${{ github.run_number }}.aab"

      - name: Upload Intervals Companion Release APK & AAB Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Intervals-Companion-v${{ env.APP_VERSION }}-b${{ github.run_number }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30
